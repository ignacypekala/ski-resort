plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.guava
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'io.github.ignacypekala.simulation.Simulation'
}

run { 
    standardInput = System.in
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
        // Options: "started", "passed", "skipped", "failed", "standardOut", "standardError"
        events /* "passed", */ "skipped", "failed"
        
        // Show detailed failure information (stack traces, etc.)
        showExceptions = true
        exceptionFormat = "full"
        showCauses = true
        showStackTraces = true
        
        // Optional: show the standard output from the tests
        showStandardStreams = true
    }

}
